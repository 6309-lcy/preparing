<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3D3A" />
  <meta name="description" content="SOA Grind — Exam P path coach. Chapters, levels, chapter tests, official samples." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>SOA Grind</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: "#F4F1EC",
            paper: "#FFFCFA",
            ink: "#1A1F1E",
            mute: "#5C6563",
            brand: { DEFAULT: "#0B3D3A", soft: "#E4F0EE", mid: "#14756F", deep: "#072E2C" },
            ok: "#1F7A4C",
            bad: "#B42318",
          },
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            sans: ["Source Sans 3", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
          },
          boxShadow: {
            card: "0 1px 0 rgba(26,31,30,0.06), 0 8px 24px rgba(26,31,30,0.04)",
            lift: "0 2px 4px rgba(26,31,30,0.04), 0 12px 28px rgba(26,31,30,0.08)",
            soft: "0 1px 2px rgba(26,31,30,0.05)",
          },
          transitionDuration: { DEFAULT: "220ms" },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-canvas text-ink font-sans antialiased">
  <div class="min-h-full w-full flex flex-col pb-20">
    <!-- Slim masthead — Hallmark edge-aligned, single row -->
    <header class="app-header sticky top-0 z-30">
      <div class="app-header-inner">
        <div class="app-brand min-w-0">
          <span class="app-mark" aria-hidden="true">P</span>
          <div class="min-w-0 leading-tight">
            <div class="app-wordmark">SOA Grind</div>
            <div id="progressLabel" class="app-status truncate">Loading…</div>
          </div>
        </div>

        <div class="app-header-actions">
          <div class="stat-pill" title="Streak">
            <i data-lucide="flame" class="h-3.5 w-3.5 text-amber-600"></i>
            <span id="streakChip" class="font-semibold tabular-nums">0</span>
          </div>
          <div class="stat-pill" title="XP">
            <i data-lucide="zap" class="h-3.5 w-3.5 text-brand-mid"></i>
            <span id="xpChip" class="font-semibold tabular-nums">0</span>
          </div>
          <button type="button" id="accountChip" class="account-chip" title="Account / cloud sync" aria-label="Account">
            <i data-lucide="user" class="h-4 w-4"></i>
            <span id="accountBarCta" class="account-chip-label">Sign in</span>
          </button>
        </div>
      </div>
      <div class="app-progress-track" aria-hidden="true">
        <div id="progressFill" class="app-progress-fill" style="width:0%"></div>
      </div>
      <!-- Screen-reader / legacy label hook kept off-layout -->
      <span id="accountBarLabel" class="sr-only">Cloud account</span>
    </header>

    <main class="flex-1 w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-4 space-y-3.5">
      <section id="view-home" class="view active space-y-3.5 w-full"></section>
      <section id="view-courses" class="view space-y-3.5 w-full"></section>
      <section id="view-learn" class="view space-y-3.5 w-full"></section>
      <section id="view-quiz" class="view space-y-3.5 w-full"></section>
      <section id="view-exam" class="view space-y-3.5 w-full"></section>
      <section id="view-path" class="view space-y-3.5 w-full"></section>
      <section id="view-wrong" class="view space-y-3.5 w-full"></section>
      <section id="view-stats" class="view space-y-3.5 w-full"></section>
      <section id="view-settings" class="view space-y-3.5 w-full"></section>
    </main>
  </div>

  <!-- Compact bottom nav -->
  <nav class="app-nav" style="padding-bottom: env(safe-area-inset-bottom)">
    <div class="app-nav-inner">
      <button class="nav-btn active" data-view="home" type="button"><i data-lucide="home" class="h-4 w-4"></i><span>Today</span></button>
      <button class="nav-btn" data-view="courses" type="button"><i data-lucide="library" class="h-4 w-4"></i><span>Courses</span></button>
      <button class="nav-btn" data-view="learn" type="button"><i data-lucide="book-open" class="h-4 w-4"></i><span>Learn</span></button>
      <button class="nav-btn" data-view="quiz" type="button"><i data-lucide="target" class="h-4 w-4"></i><span>Quiz</span></button>
      <button class="nav-btn" data-view="exam" type="button"><i data-lucide="clipboard-check" class="h-4 w-4"></i><span>Exam</span></button>
      <button class="nav-btn" data-view="wrong" type="button"><i data-lucide="rotate-ccw" class="h-4 w-4"></i><span>Wrong</span></button>
      <button class="nav-btn" data-view="stats" type="button"><i data-lucide="bar-chart-2" class="h-4 w-4"></i><span>Stats</span></button>
      <button class="nav-btn" data-view="settings" type="button"><i data-lucide="settings" class="h-4 w-4"></i><span>More</span></button>
    </div>
  </nav>

  <!-- Auth modal -->
  <div id="authModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-labelledby="authTitle">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 id="authTitle" class="font-display text-xl font-semibold tracking-tight">Sign in</h2>
          <p id="authHint" class="mt-1 text-sm text-mute">Keep progress continuous across devices.</p>
        </div>
        <button type="button" id="authClose" class="icon-btn" aria-label="Close">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>
      <form id="authForm" class="mt-5 space-y-3">
        <div>
          <label class="text-xs font-medium text-mute" for="authEmail">Email</label>
          <input id="authEmail" type="email" required autocomplete="username" class="field mt-1" />
        </div>
        <div>
          <label class="text-xs font-medium text-mute" for="authPassword">Password (6+)</label>
          <input id="authPassword" type="password" required minlength="6" autocomplete="current-password" class="field mt-1" />
        </div>
        <p id="authError" class="text-sm text-bad min-h-[1.25rem]"></p>
        <button type="submit" id="authSubmit" class="btn-primary w-full">Sign in</button>
      </form>
      <button type="button" id="authSwitch" class="btn-ghost w-full mt-2">New here? Create account</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/cloud.js"></script>
  <script src="./js/topic_guides.js"></script>
  <script src="./js/exam.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
